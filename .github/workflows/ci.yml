name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard-artifacts:
    name: Block large/binary artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail if any tracked file exceeds 5 MB
        run: |
          limit_kb=5120
          offenders=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && echo "$(du -k "{}" | cut -f1) {}"' | awk -v lim="$limit_kb" '$1 > lim')
          if [ -n "$offenders" ]; then
            echo "::error::Tracked files exceed ${limit_kb} KB — build artifacts/binaries must not be committed:"
            echo "$offenders"
            exit 1
          fi
          echo "No oversized tracked files."
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify critical packages
        run: python -c "import httpx; from fastapi.testclient import TestClient; print('OK - httpx + TestClient available')"
      - name: Run tests with coverage
        # Ratchet: 75 floor (measured 80.6%). Raise as coverage improves --
        # never lower it. The floor was 60 against a noted ~64%; coverage has
        # since climbed to 80.6%, which left twenty points of slack in which a
        # regression could hide without the gate noticing. 75 keeps roughly
        # five points of headroom for ordinary variation.
        #
        # ustat_engine is measured alongside routers and services. Analyses are
        # moving out of routers/ into the engine; measuring only the old
        # locations would show the ratchet rising purely because the untested
        # part had been renamed out of view.
        run: python -m pytest --cov=routers --cov=services --cov=ustat_engine --cov-report=term-missing --cov-fail-under=75 -q

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm run build` packages backend/ustat_engine into the wheel the
      # browser installs, via scripts/build_engine_wheel.py. It needs only the
      # standard library, but pinning the interpreter here keeps the build from
      # depending on whatever python3 the runner image happens to ship.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npx tsc -b
      # These 575 tests existed and had never run in CI. Among them is the
      # check that no dataset file is sitting in public/ waiting to be
      # published, which is worth nothing if it only runs when someone
      # remembers to.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
