method: restricted_cubic_spline
title: Restricted cubic spline terms in regression
panel: models
endpoints: ["/api/models/rcs"]
covers: ["models:rcs"]
implementation:
  library: statsmodels + custom basis
  entrypoint: RCS basis constructed in-repo to Harrell knot conventions, fitted with statsmodels
  version_source: /api/engine/identity (X-uStat-Packages)
assumptions:
  - Knot placement at Harrell default quantiles (RMS Table 2.3, 3 to 7 knots) unless overridden
  - Below n = 100 the outer default knots are the 5th smallest and 5th largest value, as Hmisc::rcspline.eval
unsupported:
  - Knot counts outside the exposed options
behavior:
  missing_data: Listwise deletion over outcome + spline variable + covariates
  weights: Not supported
  ties: Heavy ties can collapse quantile knots; degenerate knots must be surfaced
  category_coding: Covariates dummy-coded, first level reference
reference:
  software: R (pinned image qa/r_reference)
  entrypoint: rms::rcs inside rms::ols/lrm
  artifacts:
    - {file: qa/models_audit/reference.json, key: models.rcs}
compared: [coefficients, standard_errors, p_values, knots, overall_wald, nonlinearity_wald, aic]
spline_tests:
  overall: joint Wald on all k-1 spline columns plus interaction columns of the predictor (rms::anova "age" row)
  nonlinearity: joint Wald on the k-2 cubic columns plus interaction columns built on them (rms::anova "Nonlinear" row)
  statistic: F(df, residual df) for the linear model as rms::anova on ols; chi-square for logistic and Cox
  aic_comparison: Harrell-default knots at 3, 4, 5 and the fitted k; AIC counts the residual variance for the linear model as R AIC()
  tests: backend/tests/test_rcs.py (values from rms::lrm, rms::ols, rms::cph on qa/models_audit/dataset.csv)
tolerance:
  rel: 1.0e-4
  rationale: qa/models_audit/compare.py REL; identical knots make the basis identical, so only optimiser noise remains
edge_cases:
  - {case: tied quantiles collapsing two knots, status: covered, test: backend/tests/test_validation_card_edge_cases.py::test_rcs_tied_quantile_knots}
findings: []
