method: glm_count_and_gamma
title: Poisson (with offset), negative binomial, gamma GLMs
panel: models
endpoints: ["/api/models/poisson", "/api/models/negbinom", "/api/models/gamma"]
covers: ["models:poisson", "models:poisson_offset", "models:negbinom", "models:gamma"]
implementation:
  library: statsmodels
  entrypoint: statsmodels GLM (Poisson/NegativeBinomial/Gamma families) via backend/routers/models/glm.py
  version_source: /api/engine/identity (X-uStat-Packages)
assumptions:
  - Count outcome (Poisson/negbinom) or positive continuous outcome (gamma)
  - Log link throughout
unsupported:
  - Zero-inflated variants; exposure other than a single offset column
behavior:
  missing_data: Listwise deletion over outcome + predictors (+ offset column when used)
  weights: Not supported
  ties: Not applicable
  category_coding: Pandas dummy coding, first level reference
reference:
  software: R (pinned image qa/r_reference)
  entrypoint: stats::glm(family = poisson/Gamma); MASS::glm.nb
  artifacts:
    - {file: qa/models_audit/reference.json, key: models.poisson}
    - {file: qa/models_audit/reference.json, key: models.poisson_offset}
    - {file: qa/models_audit/reference.json, key: models.negbinom}
    - {file: qa/models_audit/reference.json, key: models.gamma}
compared: [coefficients, standard_errors, p_values]
tolerance:
  rel: 1.0e-4
  rationale: qa/models_audit/compare.py REL; negbinom additionally estimates the dispersion by different algorithms (statsmodels vs MASS theta iteration)
edge_cases:
  - {case: all-zero count outcome, status: covered, test: backend/tests/test_validation_card_edge_cases.py::test_poisson_all_zero_outcome}
  - {case: negative or zero values under gamma (must 400, not crash), status: covered, test: backend/tests/test_validation_card_edge_cases.py::test_gamma_nonpositive_outcome_must_reject_not_return_garbage}
findings:
  - id: poisson-all-zero-500
    summary: An all-zero count outcome made statsmodels' first deviance guess NaN and raised an uncaught ValueError, surfacing as a 500; now rejected with a 422 before the fit
    status: fixed
    evidence: "backend/routers/models/glm.py poisson_regression zero-sum guard; backend/tests/test_validation_card_edge_cases.py::test_poisson_all_zero_outcome"
