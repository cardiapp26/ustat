name: Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: 'lts/*'

jobs:
  # ─────────────────────────────────────────────────────
  # Step 1: Build the Python backend binary per platform
  # ─────────────────────────────────────────────────────
  build-backend:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            backend-name: ustat-backend
          # PyInstaller bundles the interpreter it runs under, so the Intel
          # backend has to be built on an Intel runner. Built on macos-latest
          # (Apple silicon) it came out arm64 and the Intel app could not
          # start its own backend.
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            backend-name: ustat-backend
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            backend-name: ustat-backend
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            backend-name: ustat-backend.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt

      - name: Setup Node.js (for frontend build)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Build backend binary with PyInstaller
        run: pyinstaller scripts/ustat-backend.spec --noconfirm

      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ matrix.target }}
          path: dist/ustat-backend/
          retention-days: 1

  # ─────────────────────────────────────────────────────
  # Step 2: Build Tauri desktop app (downloads backend artifact)
  # ─────────────────────────────────────────────────────
  build-tauri:
    needs: build-backend
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            backend-artifact: backend-aarch64-apple-darwin
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
            backend-artifact: backend-x86_64-apple-darwin
          # No AppImage: linuxdeploy fails on the bundled PyInstaller backend
          # ("failed to run linuxdeploy" in the first v3.7.0 run), and the
          # updater installs .deb and .rpm updates itself.
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm'
            backend-artifact: backend-x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ''
            backend-artifact: backend-x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download backend binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.backend-artifact }}
          path: src-tauri/binaries/

      - name: Make backend binary executable (Unix)
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/ustat-backend

      - name: Update version in tauri.conf.json
        shell: bash
        env:
          # The tag name is untrusted input. It used to be interpolated into
          # the run: block AND then spliced into the body of a node -e script,
          # so a tag containing a quote would have run as JavaScript on the
          # release runner, which holds the signing secrets. Now it crosses
          # into node through the environment and is never parsed as code.
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "Updating tauri.conf.json version to $VERSION"
          VERSION="$VERSION" node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            conf.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(conf, null, 2), "utf8");
          '

      - name: Generate Tauri icons from logo
        run: npx -y @tauri-apps/cli icon frontend/public/pwa-512.png

      # With createUpdaterArtifacts on, the build signs each update bundle and
      # fails without TAURI_SIGNING_PRIVATE_KEY. That is deliberate: an
      # unsigned update is one every installed copy would refuse.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'uSTAT v__VERSION__'
          releaseBody: |
            ## uSTAT Desktop v__VERSION__

            Download the installer for your operating system below.

            **What's included:**
            - Full statistical analysis engine (90+ methods)
            - Works offline: analyses run on your own computer
            - All data stays on your computer
            - Automatic updates: the app checks for new versions and asks before installing

            ### Installation
            - **macOS (Apple silicon, M1 and later)**: `uSTAT_*_aarch64.dmg`, drag uSTAT to Applications
            - **macOS (Intel)**: `uSTAT_*_x64.dmg`, drag uSTAT to Applications
            - **Windows**: `uSTAT_*_x64-setup.exe` (or the `.msi`)
            - **Linux**: `.deb` (Debian, Ubuntu) or `.rpm` (Fedora, openSUSE)

            ### First launch
            The installers are not signed with an Apple or Microsoft developer certificate yet, so the system asks once:
            - **macOS**: if uSTAT "cannot be opened", open System Settings > Privacy & Security and click **Open Anyway**.
            - **Windows**: if SmartScreen appears, click **More info** > **Run anyway**.

            Updates are signed separately, and the app only installs updates carrying uSTAT's signature.
          # Created as a draft so a half-built release is never visible; the
          # publish-release job below makes it public once every platform built.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ─────────────────────────────────────────────────────
  # Step 3: Publish the release once every platform built
  # ─────────────────────────────────────────────────────
  # Installed apps read releases/latest/download/latest.json, which only
  # resolves to a published release. Publishing last means an update is
  # offered only when installers for every platform are attached; if any
  # build fails, this job is skipped and the draft stays private.
  #
  # There is no Windows "portable" .exe on purpose. The bare ustat-desktop.exe
  # it used to upload had no bundled backend next to it and exited at start.
  publish-release:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through the environment, never interpolated into the
          # script: see the version step above.
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$REF_NAME" --repo "$REPOSITORY" --draft=false --latest
